# Fly.io config — SickDoc combined single-app deployment.
# Postgres, the API, and the web all run in one container (see Dockerfile.fly).
# Deploy from the repo root:  fly deploy

app = "sickdoc"

primary_region = "sin"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  CORS_ORIGIN = "https://sickdoc.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # The image boots Postgres, runs migrate + seed, then starts the API and web,
  # so allow generous startup time before checking health.
  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/api/health"

# Persistent disk for Postgres data (survives restarts; seed re-runs on boot).
[mounts]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
