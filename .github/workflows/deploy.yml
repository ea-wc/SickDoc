name: Deploy to Fly.io

on:
  # Called by the CI workflow after lint & unit tests pass on main.
  workflow_call:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds the Docker image on Fly's servers, so the runner
      # does not need Docker installed. fly.toml (app "sickdoc") is at the root.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
