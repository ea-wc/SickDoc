services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sickdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sickdoc}
      POSTGRES_DB: ${POSTGRES_DB:-sickdoc}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sickdoc} -d ${POSTGRES_DB:-sickdoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
